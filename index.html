<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Склад AI PRO SERVER</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sec: var(--tg-theme-secondary-bg-color, #f1f1f4);
    --card: var(--tg-theme-section-bg-color, var(--bg));
    --sep: rgba(127,127,127,.18);
    --ok: #1f9d55; --warn: #e08a00; --bad: #d64545;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--sec); color: var(--text);
    font: 15px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, select, textarea { font: inherit; color: var(--text); }
  .hidden { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 12px 0;
    box-shadow: 0 1px 0 var(--sep); }
  .searchrow { display: flex; gap: 8px; align-items: center; }
  .search { flex: 1; display: flex; align-items: center; gap: 6px; background: var(--sec);
    border-radius: 10px; padding: 0 10px; height: 38px; }
  .search input { flex: 1; border: 0; outline: 0; background: transparent; min-width: 0; height: 100%; }
  .iconbtn { width: 38px; height: 38px; border-radius: 10px; background: var(--sec); font-size: 18px; }
  .iconbtn.spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tabs { display: flex; gap: 4px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 8px 12px 10px; white-space: nowrap; color: var(--hint); border-bottom: 2px solid transparent; font-weight: 500; }
  .tab.on { color: var(--btn); border-bottom-color: var(--btn); }

  main { padding: 10px 12px 90px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 11px; border-radius: 16px; background: var(--card); white-space: nowrap; font-size: 14px; }
  .chip.on { background: var(--btn); color: var(--btn-text); }
  .chip small { opacity: .7; }
  .summary { color: var(--hint); font-size: 13px; margin: 2px 2px 8px; display: flex; justify-content: space-between; gap: 8px; }
  .summary label { display: flex; gap: 5px; align-items: center; white-space: nowrap; }

  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .row { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--sep); width: 100%; text-align: left; }
  .row:last-child { border-bottom: 0; }
  .row .t { flex: 1; min-width: 0; }
  .row .n { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .row .m { color: var(--hint); font-size: 12px; margin-top: 2px; }
  .qty { flex: none; min-width: 44px; text-align: center; padding: 4px 8px; border-radius: 8px; font-weight: 600; font-size: 14px;
    background: rgba(31,157,85,.14); color: var(--ok); }
  .qty.low { background: rgba(224,138,0,.15); color: var(--warn); }
  .qty.zero { background: rgba(127,127,127,.15); color: var(--hint); }
  .more { text-align: center; color: var(--hint); font-size: 13px; padding: 12px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--hint); margin: 16px 4px 6px; font-weight: 600; }
  .empty { text-align: center; color: var(--hint); padding: 40px 16px; }

  /* Карточка товара */
  #page { position: fixed; inset: 0; z-index: 10; background: var(--sec); overflow-y: auto; padding: 12px 12px 90px; }
  .back { color: var(--link); padding: 4px 0 10px; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .card .title { font-size: 17px; font-weight: 600; white-space: pre-line; word-break: break-word; }
  .card .title, .conf { -webkit-user-select: text; user-select: text; }
  .copyrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .copybtn { padding: 8px 12px; border-radius: 10px; background: var(--sec); font-size: 14px; }
  .conf { white-space: pre-line; margin-top: 8px; font-size: 14px; }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--sep); }
  .kv:last-child { border-bottom: 0; }
  .kv span:first-child { color: var(--hint); }
  .kv span:last-child { text-align: right; word-break: break-word; }
  .big { font-size: 28px; font-weight: 700; }
  .ops { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .op { background: var(--card); border-radius: 12px; padding: 12px 8px; font-weight: 500; }
  .op.wide { grid-column: span 2; }
  .field { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--sep); width: 100%; text-align: left; }
  .field:last-child { border-bottom: 0; }
  .field .h { color: var(--hint); flex: none; max-width: 45%; }
  .field .v { text-align: right; word-break: break-word; white-space: pre-line; }
  .field.edit .v::after { content: " ✏️"; font-size: 12px; }

  /* Нижнее окно (операции, правка) */
  #shade { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; }
  #sheet { width: 100%; max-height: 92vh; overflow-y: auto; background: var(--bg); border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  #sheet h2 { margin: 0 0 4px; font-size: 18px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 12px; word-break: break-word; }
  .stepper { display: flex; align-items: center; gap: 10px; margin: 6px 0 12px; }
  .stepper button { width: 48px; height: 48px; border-radius: 12px; background: var(--sec); font-size: 24px; }
  .stepper input { flex: 1; height: 48px; text-align: center; font-size: 22px; font-weight: 600; border: 0; border-radius: 12px; background: var(--sec); }
  .inp { width: 100%; padding: 11px 12px; border: 0; border-radius: 10px; background: var(--sec); outline: 0; }
  textarea.inp { min-height: 80px; resize: vertical; }
  .lbl { font-size: 13px; color: var(--hint); margin: 10px 2px 4px; }
  .preview { margin: 12px 2px; font-size: 15px; }
  .btns { display: flex; gap: 8px; margin-top: 14px; }
  .btn { flex: 1; height: 46px; border-radius: 12px; background: var(--btn); color: var(--btn-text); font-weight: 600; }
  .btn.sec { background: var(--sec); color: var(--text); }
  .btn:disabled { opacity: .5; }

  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 30;
    background: rgba(30,30,30,.92); color: #fff; padding: 12px 14px; border-radius: 12px; white-space: pre-line; font-size: 14px; }
  .fatal { padding: 40px 20px; text-align: center; }
  .fatal p { color: var(--hint); }
  .stat { display: flex; gap: 8px; }
  .stat .card { flex: 1; text-align: center; margin: 0; }
  .stat .card div:last-child { color: var(--hint); font-size: 13px; }
  .note { color: var(--hint); font-size: 13px; padding: 4px 4px 8px; }
  .card .chip { background: var(--sec); }
  .card .chip.on { background: var(--btn); color: var(--btn-text); }
  .aibox .row2 { display: flex; gap: 8px; margin-top: 8px; }
  .aibox .row2 .inp { flex: 1; min-width: 0; }
  .aibox .go { flex: none; width: 52px; }
  label.btn { display: flex; align-items: center; justify-content: center; }
  .ai-filled { box-shadow: inset 3px 0 0 var(--btn); }

  /* Полноэкранный режим Telegram: не залезать под кнопки Telegram сверху */
  header { padding-top: calc(10px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)); }
  #page { padding-top: calc(12px + var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)); }
  /* Широкий экран (компьютер): содержимое по центру, не растягивать строки */
  @media (min-width: 760px) {
    main, header .searchrow, header .tabs { max-width: 980px; margin-left: auto; margin-right: auto; }
    #page { padding-left: max(12px, calc(50% - 490px)); padding-right: max(12px, calc(50% - 490px)); }
    #sheet { max-width: 560px; margin: 0 auto; border-radius: 16px 16px 0 0; }
    #shade { justify-content: center; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="hdr" class="hidden">
    <div class="searchrow">
      <button class="iconbtn hidden" id="fs" title="Во весь экран (Esc — обратно в окно)">⛶</button>
      <div class="search">🔎<input id="q" type="search" placeholder="Модель, P/N, объём…" autocomplete="off" enterkeyhint="search"></div>
      <button class="iconbtn" id="refresh" title="Обновить">⟳</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"><div class="empty">Загрузка склада…</div></main>
</div>
<div id="page" class="hidden"></div>
<div id="shade" class="hidden"><div id="sheet"></div></div>
<div id="toast" class="hidden"></div>
<input type="file" id="aiFile" accept="image/*" hidden>

<script>
'use strict';
// Адрес веб-приложения Apps Script (тот же, что у Telegram-бота)
const API_URL = 'https://script.google.com/macros/s/AKfycbxzbPhxv0NFAqCPdbXx7AoWC_ecIhmXfdbz7mqJakzQp1oWA_oN9lEO3XKOrD_5EZ0/exec';
const BOT = '@Aiproserverstock_bot';
const CACHE_KEY = 'sklad_cache_v1';
const LIST_LIMIT = 150;

const OPS = {
  in:   { name: 'Приход',   icon: '📥', sign: 1,  extra: 'Поставщик (необязательно)' },
  sale: { name: 'Продажа',  icon: '📤', sign: -1, extra: 'Клиент (необязательно)' },
  ret:  { name: 'Возврат',  icon: '↩️', sign: 1,  extra: 'От кого (необязательно)' },
  wo:   { name: 'Списание', icon: '🗑', sign: -1, extra: 'Причина (необязательно)' },
  cnt:  { name: 'Пересчёт', icon: '🧮', sign: 0,  extra: 'Комментарий (необязательно)' },
};

const tg = window.Telegram && window.Telegram.WebApp;
const $ = id => document.getElementById(id);
let D = null;              // данные склада
let DEMO = false;
let view = 'stock', cat = -1, showZero = false, query = '';
let cur = null;            // открытая карточка
let newSheet = -1;         // лист для нового товара
let draft = null;          // распознанный товар {si, title, fields, qs}
let report = null, reportDays = 30;

/* ---------- утилиты ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const oneLine = s => String(s).replace(/\s*\n\s*/g, ' · ').replace(/\s+/g, ' ').trim();
const canEdit = () => D && D.me.role !== 'просмотр';
const sheetName = it => D.sheets[it.s].name.trim();
const colNum = L => { let n = 0; for (const ch of L) n = n * 26 + ch.charCodeAt(0) - 64; return n; };
function norm(s) {
  return String(s).toLowerCase()
    .replace(/ё/g, 'е').replace(/гб/g, 'gb').replace(/тб/g, 'tb')
    .replace(/(\d),(\d)/g, '$1.$2')
    .replace(/(\d)\s+(gb|tb|mb|w|ghz|mhz|g)\b/g, '$1$2')
    .replace(/[,;()\[\]"'«»]/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function haptic(type) { try { tg && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
let toastT = 0;
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), ms || 3500);
}
function conf(it) { const ci = D.sheets[it.s].conf; return ci >= 0 && it.v[ci] != null ? String(it.v[ci]).trim() : ''; }
function qtyClass(q) { return q <= 0 ? 'zero' : (q <= D.lowQty ? 'low' : ''); }

/* ---------- связь с таблицей ---------- */
async function api(action, payload) {
  if (DEMO) return demoApi(action, payload || {});
  const body = JSON.stringify(Object.assign({ action: action, initData: tg.initData }, payload || {}));
  let res;
  try {
    res = await fetch(API_URL + '?api=1', { method: 'POST', body: body });
  } catch (e) { throw new Error('Нет связи с таблицей. Проверьте интернет.'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Таблица ответила с ошибкой. Попробуйте ещё раз.'); }
  if (!j.ok) { const err = new Error(j.error || 'Ошибка'); err.code = j.code; throw err; }
  return j;
}

function setData(d) {
  const had = !!D;
  D = d;
  D.items.forEach(it => {
    it.hay = norm(D.sheets[it.s].name + ' ' + it.v.join(' '));
    it.hayC = it.hay.replace(/[\s\-\/.]/g, '');
  });
  $('hdr').classList.remove('hidden');
  // На вкладке «Новый» не перерисовываем форму, когда склад обновился в фоне: иначе пропадает набранный текст
  // и теряется выбранное фото (поле выбора файла исчезает из страницы, пока открыта камера).
  renderTabs(); if (view !== 'new' || !had) renderMain();
  if (cur) { const f = D.items.find(x => x.s === cur.s && x.id === cur.id); cur = f || null; if (cur) renderItem(); else closePage(); }
}
function saveCache() {
  if (DEMO || !D) return;
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ me: D.me, sheets: D.sheets, lowQty: D.lowQty, at: D.at,
    items: D.items.map(({ hay, hayC, ...x }) => x) })); } catch (e) {}
}
function loadCache() { try { const s = localStorage.getItem(CACHE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function clearCache() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }

let syncing = false;
async function refresh(silent) {
  if (syncing) return;
  syncing = true; $('refresh').classList.add('spin');
  try {
    const j = await api('init');
    delete j.ok;
    setData(j); saveCache();
    if (!silent) toast('✅ Склад обновлён', 1500);
  } catch (e) {
    if (e.code === 'auth' || e.code === 'noaccess') { clearCache(); D = null; fatal(e.message); }
    else if (!D) fatal(e.message);
    else toast('⚠️ ' + e.message);
  } finally {
    syncing = false; $('refresh').classList.remove('spin');
  }
}

function fatal(msg) {
  $('hdr').classList.add('hidden'); closePage(); closeSheet();
  $('main').innerHTML = '<div class="fatal"><div style="font-size:42px">📦</div><h2>Склад</h2><p>' + esc(msg) + '</p></div>';
}

/* ---------- вкладки ---------- */
function renderTabs() {
  const t = [['stock', '📦 Склад'], ['low', '⚠️ Заканчивается'], ['sales', '📊 Продажи']];
  if (canEdit()) t.push(['new', '➕ Новый']);
  $('tabs').innerHTML = t.map(([k, l]) => '<button class="tab' + (view === k ? ' on' : '') + '" data-tab="' + k + '">' + l + '</button>').join('');
}
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  view = b.dataset.tab;
  if (view !== 'stock') { query = ''; $('q').value = ''; }
  renderTabs(); renderMain(); window.scrollTo(0, 0);
  if (view === 'sales' && !report) loadReport(reportDays);
});

/* ---------- поиск ---------- */
function search(text) {
  const tokens = norm(text).split(' ').filter(Boolean);
  if (!tokens.length) return [];
  const found = [];
  D.items.forEach(it => {
    let hit = 0;
    tokens.forEach(t => {
      const tc = t.replace(/[\-\/.]/g, '');
      if (it.hay.indexOf(t) >= 0 || (tc.length >= 4 && it.hayC.indexOf(tc) >= 0)) hit++;
    });
    if (hit) found.push({ it: it, hit: hit });
  });
  if (!found.length) return [];
  found.sort((a, b) => b.hit - a.hit || b.it.q - a.it.q);
  const exact = found.filter(f => f.hit === tokens.length);
  if (exact.length) return exact.map(f => f.it);
  const best = found[0].hit;
  return found.filter(f => f.hit >= Math.max(1, best - (tokens.length > 2 ? 1 : 0))).map(f => f.it);
}
let qT = 0;
$('q').addEventListener('input', e => {
  clearTimeout(qT);
  qT = setTimeout(() => {
    query = e.target.value;
    if (query.trim() && view !== 'stock') { view = 'stock'; renderTabs(); }
    renderMain();
  }, 120);
});
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('refresh').addEventListener('click', () => refresh(false));

/* ---------- списки ---------- */
function rowHtml(it, metaExtra) {
  return '<button class="row" data-item="' + it.s + ':' + it.id + '"><div class="t"><div class="n">' + esc(oneLine(it.n)) + '</div>' +
    '<div class="m">' + esc(sheetName(it)) + ' · ID ' + it.id + (metaExtra ? ' · ' + metaExtra : '') + '</div></div>' +
    '<span class="qty ' + qtyClass(it.q) + '">' + (it.q > 0 ? it.q : '0') + '</span></button>';
}
function listHtml(items, metaFn) {
  if (!items.length) return '<div class="empty">Ничего нет</div>';
  const part = items.slice(0, LIST_LIMIT);
  return '<div class="list">' + part.map(it => rowHtml(it, metaFn && metaFn(it))).join('') + '</div>' +
    (items.length > LIST_LIMIT ? '<div class="more">Показано ' + LIST_LIMIT + ' из ' + items.length + ' — уточните поиск</div>' : '');
}
document.addEventListener('click', e => {
  const r = e.target.closest('[data-item]'); if (!r) return;
  const [s, id] = r.dataset.item.split(':').map(Number);
  const it = D.items.find(x => x.s === s && x.id === id);
  if (it) openItem(it);
});

function renderMain() {
  if (!D) return;
  const m = $('main');
  if (view === 'stock') m.innerHTML = stockHtml();
  else if (view === 'low') m.innerHTML = lowHtml();
  else if (view === 'sales') m.innerHTML = salesHtml();
  else if (view === 'new') m.innerHTML = newHtml();
}

function stockHtml() {
  if (query.trim()) {
    const res = search(query);
    return '<div class="summary"><span>Найдено: ' + res.length + '</span></div>' +
      (res.length ? listHtml(res) : '<div class="empty">По запросу «' + esc(query) + '» ничего не найдено.<br>Попробуйте короче — только модель или P/N.</div>');
  }
  const inStock = D.items.filter(it => it.q > 0);
  let chips = '<button class="chip' + (cat === -1 ? ' on' : '') + '" data-cat="-1">Все <small>' + inStock.length + '</small></button>';
  D.sheets.forEach((sh, i) => {
    const n = D.items.filter(it => it.s === i && it.q > 0).length;
    chips += '<button class="chip' + (cat === i ? ' on' : '') + '" data-cat="' + i + '">' + esc(sh.name.trim()) + ' <small>' + n + '</small></button>';
  });
  let items = D.items.filter(it => (cat === -1 || it.s === cat) && (showZero || it.q > 0));
  const units = items.reduce((s, it) => s + Math.max(0, it.q), 0);
  return '<div class="chips" id="chips">' + chips + '</div>' +
    '<div class="summary"><span>' + items.length + ' поз. · ' + units + ' шт.</span>' +
    '<label><input type="checkbox" id="zero"' + (showZero ? ' checked' : '') + '> с нулём</label></div>' +
    listHtml(items);
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-cat]'); if (!c) return;
  cat = Number(c.dataset.cat); renderMain();
});
document.addEventListener('change', e => { if (e.target.id === 'zero') { showZero = e.target.checked; renderMain(); } });

function lowHtml() {
  const low = D.items.filter(it => it.q > 0 && it.q <= D.lowQty).sort((a, b) => b.s60 - a.s60 || a.q - b.q);
  const out = D.items.filter(it => it.q <= 0 && it.s60 > 0).sort((a, b) => b.s60 - a.s60);
  const meta = it => it.s60 ? 'продано за 60 дн.: ' + it.s60 : '';
  return '<div class="note">Осталось ' + D.lowQty + ' шт. или меньше. Сначала то, что продавалось за 60 дней.</div>' +
    '<h3>Заканчивается · ' + low.length + '</h3>' + listHtml(low, meta) +
    (out.length ? '<h3>Закончились, но продавались · ' + out.length + '</h3>' + listHtml(out, meta) : '');
}

/* ---------- продажи ---------- */
async function loadReport(days) {
  reportDays = days; report = 'loading'; renderMain();
  try { report = await api('report', { days: days }); }
  catch (e) { report = null; toast('⚠️ ' + e.message); }
  if (view === 'sales') renderMain();
}
function salesHtml() {
  const per = [[7, '7 дней'], [30, '30 дней'], [90, '90 дней'], [365, 'Год']];
  let h = '<div class="chips">' + per.map(([d, l]) => '<button class="chip' + (reportDays === d ? ' on' : '') + '" data-days="' + d + '">' + l + '</button>').join('') + '</div>';
  if (report === 'loading' || !report) return h + '<div class="empty">' + (report ? 'Считаю…' : '') + '</div>';

    document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy'); ta.remove();
    return ok;
  } catch (e) { return false; }
}

/* ---------- распознавание по фото / P/N ---------- */
function readImage(file) {
  // Уменьшаем фото до 1600 px и сжимаем в JPEG — быстрее отправка, Gemini этого хватает
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      ok(cv.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('Не удалось открыть фото. Попробуйте другое.')); };
    img.src = url;
  });
}
let aiBusy = false;
async function aiRun(text, file) {
  if (aiBusy) return;
  aiBusy = true;
  const out = $('aiOut');
  const msg = (h) => { const o = $('aiOut'); if (o) o.innerHTML = h; };
  msg('<div class="note" style="padding:10px 0 0">🤖 Распознаю и ищу в интернете… обычно 10–30 секунд</div>');
  try {
    const p = { text: text || '' };
    if (file) p.image = await readImage(file);
    const r = await api('ai', p);
    window.__aiRes = r;
    if (!r.found) {
      msg('<div class="note" style="padding:10px 0 0">🤷 Не удалось определить товар.' + (r.note ? '<br>' + esc(r.note) : '') +
        '<br>Попробуйте фото наклейки с P/N крупнее или напишите P/N текстом.</div>');
      return;
    }
    const dups = (r.dups || []).map(d => D.items.find(x => x.s === d.si && x.id === d.id)).filter(Boolean);
    if (dups.length) {
      msg('<h3>🔎 ' + esc(r.title || 'Распознано') + '</h3><div class="note">Похоже, такой товар уже есть на складе. Если это он — откройте карточку и нажмите «📥 Приход».</div>' +
        listHtml(dups) + '<div class="btns"><button class="btn sec" id="aiNew">➕ Нет, это новый товар</button></div>');
      return;
    }
    aiApply(r);
  } catch (e) {
    msg('<div class="note" style="padding:10px 0 0;color:var(--bad)">⚠️ ' + esc(e.message) + '</div>');
  } finally {
    aiBusy = false;
    const f = $('aiFile'); if (f) f.value = '';
  }
}
function aiApply(r) {
  let si = r.si;
  if (!D.sheets[si] || D.sheets[si].name !== r.sheet) si = D.sheets.findIndex(s => s.name === r.sheet);

  }
  if (!tg || !tg.initData) {
    if (window.DEMO_DATA) { DEMO = true; setData(JSON.parse(JSON.stringify(window.DEMO_DATA))); return; }
    fatal('Откройте склад через Telegram-бота ' + BOT + ' — кнопка «📦 Склад» рядом с полем ввода.');
    return;
  }
  const c = loadCache();
  if (c && c.items) setData(c);
  refresh(true);
})();
</script>
</body>
</html>
