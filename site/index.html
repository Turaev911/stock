<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Склад AI PRO SERVER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0c2347; --hint: #64748b; --dark: #0a2e6b; --dark2: #1456b8; --mint: #dbeafe;
    --card: rgba(255,255,255,.74); --line: rgba(12,35,71,.08);
    --accent: #2b8cff; --accent2: #bfdbfe; --green: #1769d1; --warn: #e08a00; --bad: #d64545;
    --shadow: 0 10px 30px -12px rgba(12,48,96,.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; color: var(--ink);
    font: 15px/1.4 Onest, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  body { background:
    radial-gradient(1100px 700px at 8% -5%, #cfe3fb 0, transparent 60%),
    radial-gradient(900px 600px at 100% 100%, #e3f1ff 0, transparent 55%), #eef5ff; background-attachment: fixed; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  .shell { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 18px; padding: 18px; min-height: 100vh; max-width: 1500px; margin: 0 auto; }

  /* боковая панель */
  nav.side { position: sticky; top: 18px; height: calc(100vh - 36px); background: linear-gradient(180deg, var(--dark2), #071f4a);
    border-radius: 30px; display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 10px; box-shadow: var(--shadow); }
  .logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px;
    letter-spacing: -1px; margin-bottom: 10px; background: rgba(255,255,255,.08); }
  .nb { position: relative; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; color: rgba(255,255,255,.62);
    transition: background .25s, color .25s, transform .25s; }
  .nb svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nb:hover { color: #fff; background: rgba(255,255,255,.1); transform: scale(1.06); }
  .nb.on { background: var(--mint); color: var(--dark); }
  .nb::after { content: attr(data-tip); position: absolute; left: 58px; top: 50%; transform: translateY(-50%) translateX(-4px); background: var(--dark);
    color: #fff; padding: 5px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 5; }
  .nb:hover::after { opacity: 1; transform: translateY(-50%); }
  .sp { flex: 1; }
  .badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--warn);
    color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

  main { min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .top h1 { margin: 0; font-size: 22px; font-weight: 700; flex: 1; }
  .top h1 small { display: block; font-size: 13px; font-weight: 400; color: var(--hint); }
  .search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; height: 44px; width: min(340px, 40vw); backdrop-filter: blur(10px); }
  .search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; height: 100%; }
  .who { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px 4px 5px; height: 44px; backdrop-filter: blur(10px); }
  .ava { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--dark)); color: #fff; display: grid; place-items: center; font-weight: 700; }

  .page { animation: in .45s cubic-bezier(.2,.8,.2,1) both; }
  .noanim .card, .noanim.page { animation: none !important; }
  .noanim .bars .col i, .noanim .seg i b { transition: none; }

  /* экран входа */
  .login .shell { grid-template-columns: minmax(0, 1fr); }
  .login nav.side, .login .search, .login .who, .login #refresh, .login #logout, .login .top h1 { display: none; }
  .login main { display: grid; place-items: center; min-height: calc(100vh - 36px); }
  .lg { max-width: 420px; width: 100%; text-align: center; padding: 30px 26px; }
  .lg .logo2 { width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 14px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 24px;
    background: linear-gradient(150deg, var(--dark2), var(--dark)); letter-spacing: -1px; }
  .lg h2 { margin: 0 0 6px; font-size: 22px; } .lg p { margin: 0 0 14px; color: var(--hint); }
  .lg ol { text-align: left; margin: 0 0 16px; padding-left: 20px; color: var(--ink); } .lg li { margin: 4px 0; }
  .lg input { width: 100%; text-align: center; font-size: 28px; letter-spacing: 8px; font-weight: 650; padding: 12px; border-radius: 16px; border: 1px solid var(--line); background: rgba(255,255,255,.8); outline: 0; }
  .lg input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23,105,209,.2); }
  .lg .btn { width: 100%; justify-content: center; margin-top: 12px; padding: 13px; font-size: 16px; }
  .lg .err { color: var(--bad); margin-top: 10px; font-size: 14px; min-height: 20px; }
  .topbtn { height: 44px; padding: 0 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(10px); font-size: 14px; transition: transform .2s; }
  .topbtn:hover { transform: translateY(-2px); }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; background: rgba(20,30,28,.92); color: #fff; padding: 11px 16px; border-radius: 14px; font-size: 14px; max-width: 90vw; }
  @keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
  .c4 { grid-column: span 4; } .c3 { grid-column: span 3; } .c5 { grid-column: span 5; } .c6 { grid-column: span 6; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
  .card { background: var(--card); border: 1px solid rgba(255,255,255,.7); border-radius: 24px; padding: 18px; box-shadow: var(--shadow); backdrop-filter: blur(14px);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s; animation: in .5s cubic-bezier(.2,.8,.2,1) both; }
  .card:hover { transform: translateY(-3px); box-shadow: 0 18px 38px -14px rgba(12,48,96,.32); }
  .card h3 { margin: 0 0 12px; font-size: 15px; font-weight: 650; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card h3 span { font-weight: 400; color: var(--hint); font-size: 13px; }
  .grid > .card:nth-child(2) { animation-delay: .05s; } .grid > .card:nth-child(3) { animation-delay: .1s; } .grid > .card:nth-child(4) { animation-delay: .15s; }
  .grid > .card:nth-child(5) { animation-delay: .2s; } .grid > .card:nth-child(6) { animation-delay: .25s; } .grid > .card:nth-child(7) { animation-delay: .3s; }

  .hero { background: linear-gradient(120deg, var(--dark), var(--dark2)); color: #fff; border: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; min-height: 150px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(110,190,255,.5), transparent 70%); }
  .hero h2 { margin: 0; font-size: 26px; font-weight: 600; position: relative; z-index: 1; }
  .hero h2 em { font-family: Georgia, "Times New Roman", serif; font-weight: 400; color: var(--accent2); }
  .hero p { margin: 0; color: rgba(255,255,255,.7); max-width: 460px; position: relative; z-index: 1; }
  .btn { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 8px; background: var(--accent); color: #fff; font-weight: 600; padding: 10px 16px; border-radius: 14px; position: relative; z-index: 1; transition: transform .2s, filter .2s; }
  .btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

  .big { font-size: 38px; font-weight: 700; letter-spacing: -1px; line-height: 1.1; }
  .big small { font-size: 16px; font-weight: 500; color: var(--hint); letter-spacing: 0; margin-left: 4px; }
  .sub { color: var(--hint); font-size: 13px; margin-top: 2px; }
  .seg { display: flex; gap: 4px; height: 8px; margin: 14px 0 8px; }
  .seg i { flex: 1; border-radius: 4px; background: rgba(12,35,71,.08); overflow: hidden; }
  .seg i b { display: block; height: 100%; width: 0; background: var(--green); border-radius: 4px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .leg { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--hint); }
  .leg b { color: var(--ink); }

  .bars { display: flex; align-items: flex-end; gap: 10px; height: 150px; margin-top: 6px; }
  .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .bars .col { width: 100%; max-width: 38px; background: rgba(12,35,71,.06); border-radius: 18px; height: 112px; display: flex; align-items: flex-end; overflow: hidden; position: relative; }
  .bars .col i { width: 100%; height: 0; border-radius: 18px; background: linear-gradient(180deg, #8fc8ff, var(--accent)); transition: height 1s cubic-bezier(.2,.8,.2,1); }
  .bars .col.today i { background: linear-gradient(180deg, var(--dark2), var(--dark)); }
  .bars span { font-size: 12px; color: var(--hint); } .bars .today + span, .bars span.t { color: var(--ink); font-weight: 600; }
  .bars em { font-style: normal; font-size: 12px; font-weight: 600; }

  .list { display: flex; flex-direction: column; }
  .it { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); text-align: left; width: 100%; border-radius: 10px; transition: background .2s; }
  .it:last-child { border-bottom: 0; }
  button.it:hover { background: rgba(255,255,255,.6); }
  .ico { flex: none; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 17px; background: var(--mint); }
  .ico.out { background: #d6e8ff; } .ico.in { background: #d9f1ff; } .ico.bld { background: #e4e6ff; }
  .it .t { flex: 1; min-width: 0; }
  .it .n { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .it .m { color: var(--hint); font-size: 12px; margin-top: 2px; }
  .q { flex: none; min-width: 48px; text-align: center; padding: 5px 10px; border-radius: 10px; font-weight: 650; font-size: 14px; background: rgba(23,105,209,.12); color: var(--green); }
  .q.low { background: rgba(224,138,0,.15); color: var(--warn); } .q.zero { background: rgba(120,130,125,.15); color: var(--hint); }
  .tag { flex: none; font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 10px; }
  .tag.built { background: rgba(224,138,0,.15); color: var(--warn); } .tag.sold { background: rgba(23,105,209,.12); color: var(--green); }
  .tag.draft { background: rgba(120,90,220,.14); color: #6a4bd6; }
  /* сборки: карточки кликабельны, окно правки состава */
  .bcard { cursor: pointer; }
  #det .bbox { max-width: 640px; }
  .bpart { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .bpart .t { flex: 1; min-width: 0; } .bpart .n { font-size: 14px; word-break: break-word; } .bpart .m { font-size: 12px; color: var(--hint); margin-top: 2px; } .bpart .m.bad { color: var(--bad); }
  .bmini { display: flex; align-items: center; gap: 4px; flex: none; }
  .bmini button { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.85); border: 1px solid var(--line); font-size: 17px; line-height: 1; }
  .bmini b { min-width: 26px; text-align: center; }
  .bsr { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; max-height: 260px; overflow-y: auto; }
  .bpick { display: flex; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border-radius: 14px; background: rgba(255,255,255,.7); border: 1px solid var(--line); }
  .bpick:hover { border-color: var(--accent); } .bpick.off { opacity: .45; }
  .bpick .t { flex: 1; min-width: 0; display: flex; flex-direction: column; } .bpick .n { font-size: 14px; } .bpick .m { font-size: 12px; color: var(--hint); }
  #det .bbtns { flex-wrap: wrap; } #det .bbtns .pbtn, #det .bbtns .sbtn { min-width: 160px; }

  .minis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .mini { border-radius: 18px; padding: 14px; background: linear-gradient(160deg, #e4f0ff, #f6f9ff); border: 1px solid rgba(255,255,255,.8); text-align: left; transition: transform .25s; display: flex; flex-direction: column; gap: 4px; }
  .mini:hover { transform: translateY(-3px); }
  .mini b { font-size: 13px; } .mini span { font-size: 12px; color: var(--hint); }
  .dark { background: linear-gradient(150deg, var(--dark), #071f4a); color: #fff; border: 0; }
  .dark .sub { color: rgba(255,255,255,.65); }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; color: var(--hint); }
  .cal b { display: grid; place-items: center; height: 34px; border-radius: 12px; font-weight: 600; color: var(--ink); font-size: 14px; background: rgba(255,255,255,.55); }
  .cal b.today { background: var(--dark); color: #fff; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { padding: 7px 13px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 14px; transition: background .2s, color .2s, transform .2s; }
  .chip:hover { transform: translateY(-2px); } .chip small { opacity: .65; }
  .chip.on { background: var(--dark); color: #fff; border-color: var(--dark); }
  .empty { text-align: center; color: var(--hint); padding: 40px 16px; }
  .part { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .part:last-child { border-bottom: 0; } .part span:first-child { color: var(--hint); flex: none; } .part span:last-child { text-align: right; white-space: pre-line; }
  .note { font-size: 12px; color: var(--hint); margin-top: 18px; text-align: center; }

  @media (max-width: 1100px) { .c4, .c5, .c7, .c8, .c3 { grid-column: span 12; } .c6 { grid-column: span 12; } .grid .c3.half { grid-column: span 6; } }
  @media (max-width: 760px) {
    .shell { grid-template-columns: 1fr; padding: 12px 12px 92px; gap: 12px; }
    nav.side { position: fixed; z-index: 10; left: 12px; right: 12px; bottom: 12px; top: auto; height: 68px; flex-direction: row; justify-content: space-around; padding: 0 8px; border-radius: 24px; }
    .logo, .sp { display: none; } .nb::after { display: none; }
    .search { width: auto; flex: 1; } .who span { display: none; } .who { padding: 4px; } .top h1 small { display: none; }
    .top { flex-wrap: wrap; } .top h1 { flex-basis: 100%; }
    .minis { grid-template-columns: 1fr; }
  }

  /* ===== Оформление в духе последних iOS («жидкое стекло»): полупрозрачные панели, блики по краям, капсулы ===== */
  :root {
    --accent: #0a7aff; --green: #0a6cf0; --line: rgba(12,35,71,.07);
    --glass: linear-gradient(140deg, rgba(255,255,255,.74), rgba(255,255,255,.4));
    --edge: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.3), inset 1px 0 0 rgba(255,255,255,.35), inset -1px 0 0 rgba(255,255,255,.35);
    --shadow: 0 14px 34px -16px rgba(10,60,130,.3), 0 2px 6px -2px rgba(10,60,130,.08);
    --blur: blur(26px) saturate(180%);
  }
  body { background:
    radial-gradient(900px 620px at 4% -6%, #9ccbff 0, transparent 62%),
    radial-gradient(760px 560px at 104% 8%, #c4dcff 0, transparent 58%),
    radial-gradient(900px 640px at 92% 106%, #8fc3ff 0, transparent 60%),
    radial-gradient(700px 520px at -4% 100%, #d4ebff 0, transparent 58%), #eaf3ff; background-attachment: fixed; }

  .card, .search, .who, .topbtn, .chip, nav.side, .mini {
    background: var(--glass); border: 1px solid rgba(255,255,255,.6);
    -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--edge), var(--shadow); }
  .card { border-radius: 30px; padding: 20px; }
  .card:hover { transform: translateY(-2px); box-shadow: var(--edge), 0 22px 44px -18px rgba(10,60,130,.36); }
  .card h3 { font-size: 16px; font-weight: 700; letter-spacing: -.2px; }

  .top h1 { font-size: 30px; font-weight: 800; letter-spacing: -.6px; line-height: 1.1; }
  .top h1 small { margin-top: 3px; font-weight: 500; letter-spacing: 0; }
  .search, .who, .topbtn { border-radius: 999px; height: 46px; }
  .search { padding: 0 16px; }
  .search:focus-within { box-shadow: var(--edge), 0 0 0 3px rgba(10,122,255,.22), var(--shadow); }
  .topbtn { padding: 0 16px; font-weight: 600; }
  .topbtn:active, .chip:active, .btn:active, .nb:active { transform: scale(.96); }
  .ava { background: linear-gradient(145deg, #4aa3ff, var(--accent)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }

  /* боковая панель — стеклянная капсула */
  nav.side { border-radius: 999px; padding: 14px 0; gap: 8px; z-index: 20; }   /* z-index: подсказки меню должны быть поверх карточек */
  .logo { border-radius: 14px; background: linear-gradient(145deg, #4aa3ff, var(--accent)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 14px -6px rgba(10,122,255,.6); }
  .nb { color: rgba(12,35,71,.55); width: 48px; height: 48px; }
  .nb:hover { color: var(--ink); background: rgba(255,255,255,.6); }
  .nb.on { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 18px -8px rgba(10,122,255,.75); }
  .nb::after { background: #14203a; color: #fff; border-radius: 999px; padding: 6px 12px; left: 60px; font-weight: 500; box-shadow: 0 8px 18px -8px rgba(10,30,70,.6); }
  .badge { background: #ff3b30; box-shadow: 0 0 0 2px rgba(255,255,255,.85); }

  /* синие панели — тоже со стеклянным бликом */
  .hero, .dark { border: 1px solid rgba(255,255,255,.22); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), var(--shadow); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .hero { background: linear-gradient(125deg, #0a4fc4, var(--accent) 70%, #5cb2ff); }
  .dark { background: linear-gradient(150deg, #0b3f9e, #0a2a6e); }
  .hero h2 { font-weight: 700; letter-spacing: -.4px; }
  .hero h2 em { font-family: inherit; font-style: normal; font-weight: 700; color: #cfe6ff; }
  .btn { border-radius: 999px; padding: 11px 20px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .lg .btn { background: var(--accent); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 22px -10px rgba(10,122,255,.8); }
  .lg input { border-radius: 18px; background: rgba(255,255,255,.7); }
  .lg .logo2 { border-radius: 20px; background: linear-gradient(145deg, #4aa3ff, var(--accent)); box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 12px 24px -10px rgba(10,122,255,.7); }

  .big { font-weight: 800; letter-spacing: -1.4px; }
  .chip { border-radius: 999px; padding: 8px 15px; font-weight: 500; }
  .chip.on { background: var(--accent); color: #fff; border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 8px 18px -8px rgba(10,122,255,.7); }
  .q, .tag { border-radius: 999px; }
  .q { background: rgba(10,122,255,.12); color: var(--green); }
  .q.low { background: rgba(255,149,0,.16); color: #c96a00; }
  .ico { border-radius: 13px; width: 40px; height: 40px; color: #fff; background: linear-gradient(145deg, #8e9bb3, #5b6b88);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 6px 12px -6px rgba(10,60,130,.45); }
  .ico svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .ico.out { background: linear-gradient(145deg, #4aa3ff, #0a6cf0); }
  .ico.in { background: linear-gradient(145deg, #5fd4f4, #1aa3d8); }
  .ico.bld { background: linear-gradient(145deg, #8f9bff, #5661e8); }
  .ico.oth { background: linear-gradient(145deg, #8e9bb3, #5b6b88); }
  .it { border-radius: 14px; padding: 12px 8px; }
  button.it:hover { background: rgba(255,255,255,.55); }
  .mini { border-radius: 22px; }
  .cal b { border-radius: 999px; background: rgba(255,255,255,.5); }
  .cal b.today { background: var(--accent); box-shadow: 0 6px 14px -6px rgba(10,122,255,.7); }
  .bars .col { border-radius: 999px; } .bars .col i { border-radius: 999px; background: linear-gradient(180deg, #7cc0ff, var(--accent)); }
  .bars .col.today i { background: linear-gradient(180deg, #0a4fc4, #0a2a6e); }
  .seg i, .seg i b { border-radius: 999px; }
  #toast { border-radius: 999px; background: rgba(20,30,50,.78); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); padding: 12px 20px; }

  /* карточка позиции (по клику на строку) */
  #det { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(10,30,70,.32); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  #det .box { position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; margin: 0; animation: in .3s cubic-bezier(.2,.8,.2,1) both; }
  #toast { z-index: 60; }
  #det .box { background: rgba(246,250,255,.96); }
  #det .box:hover { transform: none; }
  #det .x { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%; background: rgba(12,35,71,.08); font-size: 15px; }
  #det .dt { font-size: 19px; font-weight: 700; letter-spacing: -.2px; white-space: pre-line; word-break: break-word; padding-right: 36px; margin-bottom: 4px; user-select: text; }
  #det .dq { margin: 6px 0; } #det .big.low { color: var(--warn); } #det .big.zero { color: var(--hint); }
  #det h4 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--hint); }
  #det .conf { white-space: pre-line; font-size: 14px; user-select: text; }
  #det .part span:last-child { user-select: text; }
  /* операции с остатком и форма нового раздела */
  #det .pend { margin-top: 8px; font-size: 13px; color: var(--accent); font-weight: 600; }
  #det .opsrow { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  #det .lbl { font-size: 13px; color: var(--hint); margin: 12px 2px 5px; }
  #det .inp { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.85); outline: 0; font: inherit; color: var(--ink); }
  #det .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,122,255,.18); }
  #det .stepper { display: flex; align-items: center; gap: 10px; }
  #det .stepper button { flex: none; width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.85); border: 1px solid var(--line); font-size: 24px; line-height: 1; }
  #det .stepper input { flex: 1; min-width: 0; height: 48px; text-align: center; font: inherit; font-size: 22px; font-weight: 700; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.85); outline: 0; color: var(--ink); }
  #det .stepper input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,122,255,.18); }
  #det .preview { margin: 14px 2px 2px; min-height: 22px; }
  #det .btns { display: flex; gap: 10px; margin-top: 16px; }
  .pbtn, .sbtn { flex: 1; height: 48px; border-radius: 999px; font-weight: 700; font: inherit; font-weight: 700; transition: transform .15s, opacity .2s; }
  .pbtn { background: var(--accent); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 10px 20px -10px rgba(10,122,255,.8); }
  .sbtn { background: rgba(12,35,71,.07); color: var(--ink); }
  .pbtn:active, .sbtn:active { transform: scale(.97); }
  .pbtn:disabled { opacity: .45; cursor: default; }
  .chip.add { color: var(--accent); font-weight: 600; }
  .it.rw { cursor: pointer; }
  .it.rw:hover { background: rgba(255,255,255,.6); }
  .cpy { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--hint); background: transparent; transition: background .2s, color .2s, transform .15s; }
  .cpy svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .cpy:hover { background: rgba(10,122,255,.12); color: var(--accent); }
  .cpy:active { transform: scale(.9); }
  .it.rw .n { user-select: text; -webkit-user-select: text; }
  /* инвентаризация */
  .ivbar { height: 10px; border-radius: 999px; background: rgba(12,35,71,.08); overflow: hidden; margin: 12px 0 8px; }
  .ivbar b { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
  .ivbtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
  .ivbtns .pbtn, .ivbtns .sbtn { flex: none; padding: 0 20px; height: 44px; }
  .ivok { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; background: rgba(52,199,89,.14); color: #1f8f43; font-weight: 600; font-size: 13px; transition: transform .15s, background .2s; }
  .ivok:hover { background: rgba(52,199,89,.24); } .ivok:active { transform: scale(.94); }
  .ivtag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(52,199,89,.14); color: #1f8f43; }
  .ivtag.wait { background: rgba(255,149,0,.16); color: #c96a00; }
  .ivwarn { color: #c96a00; }
  @media (max-width: 760px) { .ivt { display: none; } .ivok { width: 38px; padding: 0; font-size: 16px; } #det .ivok { width: auto; padding: 0 12px; font-size: 13px; } }

  @media (max-width: 760px) {
    nav.side { border-radius: 999px; height: 66px; left: 16px; right: 16px; bottom: 14px; }
    .top h1 { font-size: 28px; }
    .card { border-radius: 26px; padding: 16px; }
  }
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="nav"></nav>
  <main>
    <div class="top">
      <h1 id="title">Обзор<small id="sub"></small></h1>
      <label class="search">🔎<input id="q" type="search" placeholder="Модель, P/N, объём…" autocomplete="off"></label>
      <button class="topbtn hidden" id="refresh" title="Обновить данные">⟳</button>
      <div class="who"><div class="ava" id="ava">?</div><span id="whoName"></span></div>
      <button class="topbtn hidden" id="logout" title="Выйти с сайта">Выйти</button>
    </div>
    <div id="view" class="page"></div>
    <div class="note" id="foot"></div>
    <div id="toast" class="hidden"></div>
  </main>
</div>
<div id="det" class="hidden"></div>

<script>
'use strict';
/* Макет сайта-дашборда склада. Пока данные демонстрационные (DEMO_DATA + выдуманные операции).
   Дальше этот же код получит настоящие данные из скрипта «Бот склада» после входа. */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const oneLine = s => String(s).replace(/\s*\n\s*/g, ' · ').replace(/\s+/g, ' ').trim();

/* ---------- данные ---------- */
let D = null, X = null;
// сборка из таблицы → карточка сайта (платформа + краткий состав)
function mapBuild(b) {
  const first = t => String(t || '').split('\n')[0];
  const plat = b.parts.find(p => p.l === 'Платформа') || b.parts[0] || { t: '' };
  return { no: b.no, st: b.st, who: b.by, cl: b.cl, p: first(plat.t).replace(/^\d+×\s*/, '') || 'Сборка',
    n: b.parts.filter(p => p !== plat).map(p => first(p.t)).join(' · ') };
}
function buildX() {
  const items = D.items;
  const sheetName = it => D.sheets[it.s].name.trim();
  const inStock = items.filter(i => i.q > 0);
  const units = inStock.reduce((s, i) => s + i.q, 0);
  const low = items.filter(i => i.q > 0 && i.q <= (D.lowQty || 2));
  const by = {};
  inStock.forEach(i => { const k = sheetName(i); by[k] = (by[k] || 0) + i.q; });
  const cats = Object.keys(by).map(k => ({ name: k, units: by[k] })).sort((a, b) => b.units - a.units);
  const top = items.filter(i => i.s30 > 0).sort((a, b) => b.s30 - a.s30);
  const demo = !D.ops;
  return {
    units: units, positions: inStock.length, low: low, cats: cats, top: top, sheetName: sheetName,
    sold30: D.sold30 != null ? D.sold30 : (demo ? 47 : items.reduce((s, i) => s + i.s30, 0)),
    arrived30: D.arrived30 != null ? D.arrived30 : (demo ? 63 : 0),
    week: D.week || [3, 7, 4, 9, 5, 2, 6],               // продажи по дням недели (Пн…Вс)
    ops: D.ops || [
      { k: 'sale', who: 'Окил', what: '2× Intel Xeon Gold 6140', cl: 'Artel', ago: '12 мин назад' },
      { k: 'in', who: 'Умар', what: '8× RAM 32GB DDR4 3200 RDIMM', cl: 'Поставщик Tashkent IT', ago: '1 ч назад' },
      { k: 'build', who: 'Олим', what: 'Сборка №3 · SUPERMICRO 4125GS', cl: '', ago: '3 ч назад' },
      { k: 'sale', who: 'Окил', what: '4× SSD 960GB SATA Samsung PM893', cl: 'Uzum', ago: 'вчера' },
      { k: 'in', who: 'Окил', what: '2× Mellanox ConnectX-4 25GbE', cl: 'Поставщик', ago: 'вчера' },
    ],
    builds: D.ops ? (D.builds || []).map(mapBuild) : [
      { no: 3, st: 'Собран', p: 'SUPERMICRO 4125GS 4U', n: '2× Xeon Gold 6140 · 8× 32GB · 2× SSD', who: 'Олим' },
      { no: 2, st: 'Продан', p: 'Dell R740 2U 12LFF', n: '2× Xeon Gold 6130 · 16× 32GB', who: 'Окил', cl: 'Artel' },
      { no: 1, st: 'Продан', p: 'HPE DL380 Gen10 8SFF', n: '2× Xeon Silver 4214 · 8× 16GB', who: 'Умар', cl: 'Uzum' },
    ],
  };
}

/* ---------- навигация ---------- */
const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  box: '<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  alert: '<path d="M12 3l10 18H2L12 3z"/><path d="M12 10v5"/><path d="M12 18h.01"/>',
  tools: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4 2.6-2.6z"/>',
  chart: '<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>',
  check: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
};
const PAGES = [['home', 'Обзор', 'home'], ['stock', 'Склад', 'box'], ['low', 'Заканчивается', 'alert'], ['inv', 'Инвентаризация', 'check'], ['builds', 'Сборки', 'tools'], ['sales', 'Продажи', 'chart']];
let page = 'home', cat = -1, query = '', lastPage = '';
let showZero = false, limit = 150;   // показывать и позиции с нулём; сколько строк показано сейчас
function renderNav() {
  const lowN = X.low.length, invN = D.inv ? invLeft().length : 0;
  $('nav').innerHTML = '<div class="logo">//</div>' + PAGES.map(([k, l, ic]) =>
    '<button class="nb' + (page === k ? ' on' : '') + '" data-tip="' + l + '" data-p="' + k + '" aria-label="' + l + '"><svg viewBox="0 0 24 24">' + ICONS[ic] + '</svg>' +
    (k === 'low' && lowN ? '<span class="badge">' + lowN + '</span>' : '') +
    (k === 'inv' && invN ? '<span class="badge" style="background:var(--accent)">' + invN + '</span>' : '') + '</button>').join('') + '<div class="sp"></div>';
}
document.addEventListener('click', e => {
  // окно позиции: операции, новый раздел
  const opb = e.target.closest('[data-op]'); if (opb) { openOp(opb.dataset.op); return; }
  const stp = e.target.closest('[data-step]'); if (stp) { const i = $('opq'); i.value = Math.max(0, (Math.floor(Number(i.value)) || 0) + Number(stp.dataset.step)); updOp(); return; }
  if (e.target.closest('[data-opback]')) { detMode = 'card'; renderDet(); return; }
  if (e.target.closest('#opok')) { doOp(); return; }
  if (e.target.closest('[data-newcat]')) { openNewCat(); return; }
  const ni = e.target.closest('[data-newitem]'); if (ni) { openNewItem(ni.dataset.newitem === '' ? -1 : Number(ni.dataset.newitem)); return; }
  if (e.target.closest('#niok')) { doNewItem(); return; }
  if (e.target.closest('#ncok')) { doNewCat(); return; }
  const ivo = e.target.closest('[data-ivok]'); if (ivo) { e.stopPropagation(); invOk(Number(ivo.dataset.ivok)); return; }
  const ivc = e.target.closest('[data-inv]'); if (ivc) { invAsk(ivc.dataset.inv, ivc.dataset.sheet || ''); return; }
  if (e.target.closest('#ivgo')) { invDo(); return; }
  const b = e.target.closest('[data-p]'); if (b) { go(b.dataset.p); return; }
  const c = e.target.closest('[data-cat]'); if (c) { cat = Number(c.dataset.cat); limit = 150; render(); return; }
  if (e.target.closest('[data-zero]')) { showZero = !showZero; limit = 150; render(); return; }
  if (e.target.closest('[data-more]')) { limit += 150; render(); return; }
  const cp = e.target.closest('[data-copy]'); if (cp) { e.stopPropagation(); copyName(Number(cp.dataset.copy)); return; }
  const it = e.target.closest('[data-it]'); if (it) { openDet(Number(it.dataset.it)); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'det') closeDet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDet();
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.it) openDet(Number(e.target.dataset.it));
});
function go(p) { page = p; query = ''; limit = 150; $('q').value = ''; location.hash = p; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { const p = location.hash.slice(1); if (PAGES.some(x => x[0] === p) && p !== page) { page = p; render(); } });
$('q').addEventListener('input', e => { query = e.target.value; limit = 150; if (query.trim() && page !== 'stock') { page = 'stock'; } render(); });

/* ---------- страницы ---------- */
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/гб/g, 'gb').replace(/тб/g, 'tb').replace(/(\d),(\d)/g, '$1.$2')
  .replace(/(\d)\s+(gb|tb|mb|w|ghz|mhz|g)\b/g, '$1$2').replace(/[,;()\[\]"'«»]/g, ' ').replace(/\s+/g, ' ').trim();
const qcls = q => q <= 0 ? 'zero' : q <= (D.lowQty || 2) ? 'low' : '';
function rowHtml(it) {
  const ix = D.items.indexOf(it);
  return '<div class="it rw" role="button" tabindex="0" data-it="' + ix + '"><div class="t"><div class="n">' + esc(oneLine(it.n)) + '</div><div class="m">' + esc(X.sheetName(it)) + ' · ID ' + it.id +
    (it.s60 ? ' · продано за 60 дн.: ' + it.s60 : '') + '</div></div><span class="q ' + qcls(it.q) + '">' + (it.q > 0 ? it.q : 0) + '</span>' +
    '<button class="cpy" data-copy="' + ix + '" title="Скопировать название" aria-label="Скопировать название"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg></button></div>';
}

/* копирование названия в буфер обмена (с запасным способом для старых браузеров) */
function copyName(idx) {
  const it = D.items[idx]; if (!it) return;
  const text = String(it.n).replace(/\s*\n\s*/g, ' ').trim();
  const ok = () => toast('📋 Скопировано: ' + (text.length > 60 ? text.slice(0, 57) + '…' : text));
  const fallback = () => {
    try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;left:-999px'; document.body.appendChild(ta);
      ta.select(); const r = document.execCommand('copy'); document.body.removeChild(ta); r ? ok() : toast('Не удалось скопировать — выделите название и нажмите Ctrl+C'); }
    catch (e) { toast('Не удалось скопировать — выделите название и нажмите Ctrl+C'); }
  };
  try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback); else fallback(); } catch (e) { fallback(); }
}

/* карточка позиции: все данные из таблицы (все колонки листа, конфигурация, продажи) */
const OPS = {
  sale: { name: 'Продажа', sign: -1, extra: 'Клиент (необязательно)' },
  in:   { name: 'Приход',  sign: 1,  extra: 'Поставщик (необязательно)' },
  ret:  { name: 'Возврат', sign: 1,  extra: 'От кого (необязательно)' },
  wo:   { name: 'Списание', sign: -1, extra: 'Причина (необязательно)' },
  cnt:  { name: 'Пересчёт', sign: 0, extra: 'Комментарий (необязательно)' },
};
const canEdit = () => D && D.me.role !== 'просмотр';
const isAdmin = () => D && D.me.role === 'админ';
let detKey = null, detMode = '', detOp = '', opBusy = false;   // какая позиция открыта (лист+ID), что в окне: card / op / newcat
const curItem = () => detKey && D.items.find(i => D.sheets[i.s].name.trim() === detKey.n && i.id === detKey.id);

function openDet(idx) {
  const it = D.items[idx]; if (!it) return;
  detKey = { n: D.sheets[it.s].name.trim(), id: it.id }; detMode = 'card';
  renderDet(); $('det').classList.remove('hidden');
}
/* перерисовать окно открытой позиции (после изменения остатка здесь или на другом устройстве) */
function refreshDet() {
  if (detMode === 'card') renderDet();
  else if (detMode === 'op') { if (!curItem()) closeDet(); else updOp(); }
  else if (detMode === 'bcard') renderBCard();
  else if (sb && sb.no && /^b(edit|conf)$/.test(detMode) && !bBusy) {   // открытую на правку сборку изменили на другом экране
    const b = (D.builds || []).find(x => x.no === sb.no);
    if (!b || isSoldB(b) || isDraftBS(b) !== isDraftBS(sb)) { closeDet(); toast('Сборку изменили на другом экране — откройте её заново.'); }
  }
}
function renderDet() {
  const it = curItem(); if (!it) { closeDet(); return; }
  const idx = D.items.indexOf(it);
  const sh = D.sheets[it.s], v = it.v || [];
  const conf = sh.conf >= 0 && v[sh.conf] != null ? String(v[sh.conf]).trim() : '';
  const rows = (sh.headers || []).map((h, i) => (i < 3 || i === sh.conf || v[i] === '' || v[i] == null) ? '' :
    '<div class="part"><span>' + esc(h || ('колонка ' + (i + 1))) + '</span><span>' + esc(v[i]) + '</span></div>').join('');
  $('det').innerHTML = '<div class="card box"><button class="x" data-close aria-label="Закрыть">✕</button>' +
    '<div class="dt">' + esc(it.n) + '</div><div class="sub" style="margin-bottom:12px">' + esc(sh.name.trim()) + ' · ID ' + it.id + '</div>' +
    '<div class="dq"><span class="big ' + qcls(it.q) + '"><span>' + (it.q > 0 ? it.q : 0) + '</span><small>шт. ' + (it.q > 0 ? 'в наличии' : 'нет в наличии') + '</small></span></div>' +
    '<div class="sub">Продано за 30 дней: <b>' + it.s30 + '</b> · за 60 дней: <b>' + it.s60 + '</b></div>' +
    (() => { const r = rsvByS(it); return r.length ? '<div class="sub" style="margin-top:6px;color:#6a4bd6">📝 В черновиках сборок: ' + r.map(x => '№' + x.no + ' — ' + x.q + ' шт.').join(', ') +
      ' · свободно ' + Math.max(0, it.q - r.reduce((s, x) => s + x.q, 0)) + ' шт.</div>' : ''; })() +
    (opBusy ? '<div class="pend">⏳ Записываю в таблицу…</div>' : '') +
    (invRecOf(it) ? '<div class="sub" style="margin-top:8px">Инвентаризация' + (invE(it) ? '' : ' (завершена)') + ': ' + (it.ck ? '<span class="ivtag">✔ проверен</span>' : '<span class="ivtag wait">⏳ ещё не проверен</span>') +
      (!it.ck && canEdit() && invE(it) ? ' <button class="ivok" data-ivok="' + idx + '" style="margin-left:6px">✔ Всё верно, ' + Math.max(0, it.q) + ' шт.</button>' : '') + '</div>' : '') +
    (canEdit() ? '<div class="opsrow">' + Object.keys(OPS).map(c => '<button class="chip' + (c === 'sale' || c === 'in' ? ' on' : '') + '" data-op="' + c + '">' + OPS[c].name + '</button>').join('') + '</div>' : '') +
    (conf ? '<h4>Конфигурация</h4><div class="conf">' + esc(conf) + '</div>' : '') +
    (rows ? '<h4>Все данные из таблицы</h4>' + rows : '') +
    '<button class="chip" id="cp" style="margin-top:14px">📋 Скопировать название</button></div>';
  $('cp').addEventListener('click', () => copyName(idx));
}
function closeDet() { $('det').classList.add('hidden'); detKey = null; detMode = ''; sb = null; bNo = 0; }

/* ---------- изменение остатка с сайта (тот же путь, что в мини-приложении: проверка, запись в таблицу и «Журнал») ---------- */
function openOp(code) {
  const it = curItem(); if (!it || !canEdit()) return;
  if (opBusy) { toast('Подождите секунду: предыдущая операция ещё записывается.'); return; }
  detOp = code; detMode = 'op';
  const op = OPS[code];
  $('det').innerHTML = '<div class="card box"><button class="x" data-close aria-label="Закрыть">✕</button>' +
    '<div class="dt">' + op.name + '</div><div class="sub" style="margin-bottom:6px">' + esc(oneLine(it.n)) + '</div>' +
    '<div class="lbl">' + (code === 'cnt' ? 'Сколько штук на самом деле?' : 'Сколько штук?') + '</div>' +
    '<div class="stepper"><button data-step="-1" aria-label="Меньше">−</button><input id="opq" type="number" inputmode="numeric" min="0" value="' + (code === 'cnt' ? Math.max(0, it.q) : 1) + '"><button data-step="1" aria-label="Больше">+</button></div>' +
    '<div class="lbl">' + op.extra + '</div><input id="opx" class="inp" maxlength="200" autocomplete="off">' +
    '<div class="preview" id="opp"></div>' +
    '<div class="btns"><button class="sbtn" data-opback>Назад</button><button class="pbtn" id="opok">Подтвердить</button></div></div>';
  $('opq').addEventListener('input', updOp);
  $('opq').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doOp(); } });
  $('opx').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doOp(); } });
  updOp(); $('opq').focus(); $('opq').select();
}
function updOp() {
  const it = curItem(); if (!it || !$('opq')) return;
  const op = OPS[detOp], q = Math.floor(Number($('opq').value));
  const ok = q >= 0 && (detOp === 'cnt' || q > 0), after = op.sign === 0 ? q : it.q + op.sign * q;
  const rb = op.sign < 0 ? rsvByS(it) : [], rsv = rb.reduce((s, x) => s + x.q, 0);   // детали в черновиках сборок продавать/списывать нельзя
  const lock = after >= 0 && rsv > 0 && after < rsv;
  $('opp').innerHTML = ok ? 'Остаток: <b>' + it.q + '</b> → <b' + (after < 0 || lock ? ' style="color:var(--bad)"' : '') + '>' + after + '</b> шт.' +
    (after < 0 ? '<br><span style="color:var(--bad)">На складе только ' + it.q + ' шт.</span>' : '') +
    (lock ? '<br><span style="color:var(--bad)">' + rsv + ' шт. зарезервировано в черновиках сборок (' + rb.map(x => '№' + x.no).join(', ') + '). Свободно: ' + Math.max(0, it.q - rsv) + ' шт.</span>' : '') : '';
  $('opok').disabled = !ok || after < 0 || lock || opBusy;
}
/* Остаток меняется на экране СРАЗУ (не ждём таблицу); если запись не прошла — возвращаем прежнее число и говорим об ошибке. */
async function doOp() {
  const it = curItem(); if (!it || opBusy || $('opok').disabled) return;
  const op = OPS[detOp], code = detOp, q = Math.floor(Number($('opq').value)), extra = $('opx').value;
  const prev = { q: it.q, s30: it.s30, s60: it.s60, ck: it.ck };
  const body = { action: 'op', token: getToken(), sheet: D.sheets[it.s].name, row: it.r, id: it.id, name: it.n, code: code, q: q, extra: extra };
  opBusy = true;
  it.q = op.sign === 0 ? q : it.q + op.sign * q;
  if (invE(it)) it.ck = 1;                            // любая операция во время инвентаризации ЕГО листа = товар проверен
  if (code === 'sale') { it.s30 += q; it.s60 += q; }
  detMode = 'card'; render(); renderDet();
  try {
    const j = await api(body);
    const cur = curItem() || it;
    cur.q = j.qty;                                    // итог берём из таблицы (если кто-то успел изменить параллельно)
    opBusy = false; render(); renderDet(); toast(j.message);
  } catch (e) {
    const cur = curItem() || it;
    cur.q = prev.q; cur.s30 = prev.s30; cur.s60 = prev.s60; cur.ck = prev.ck;
    opBusy = false; render(); renderDet();
    if (e.code === 'auth') { setToken(''); closeDet(); showLogin(e.message); return; }
    toast('⚠️ ' + e.message + ' Остаток возвращён.');
  }
}

/* ---------- инвентаризация: что после её начала никто не трогал (остаток > 0, но ни пересчёта, ни «Всё верно», ни операций) ---------- */
/* Инвентаризация идёт по ЛИСТАМ: D.inv = { 'SSD': {start, by}, 'HDD': {…} } или { '*': … } (все листы). Товар «под инвентаризацией» только если его лист в этом списке. */
const invE = it => D.inv ? (D.inv[D.sheets[it.s].name.trim()] || D.inv['*'] || null) : null;   // идёт сейчас
/* завершённые инвентаризации (D.invDone): отметки ✔ остаются видны, но «Всё верно» и «Завершить» там уже не нужны */
const invRecOf = it => { const r = Object.assign({}, D.invDone || {}, D.inv || {}); return r[D.sheets[it.s].name.trim()] || r['*'] || null; };
const invLeft = () => D.items.filter(i => invE(i) && i.q > 0 && !i.ck);
const invLeftOf = k => invLeft().filter(i => k === '*' || D.sheets[i.s].name.trim() === k);
const invLbl = k => k === '*' ? 'Все листы' : k;
let invBusy = 0, invCmd = '', invKey = '';
const fmtDT = ms => new Date(ms).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
function invRow(it, ok) {
  const ix = D.items.indexOf(it);
  const b = ok && canEdit() && invE(it) ? '<button class="ivok" data-ivok="' + ix + '" title="Товар на месте, количество верное" aria-label="Всё верно">✔<span class="ivt"> Всё верно</span></button>' : '';
  return rowHtml(it).replace('<button class="cpy"', b + '<button class="cpy"');
}

  const chips = !canEdit() ? '' : (inv['*'] ? '' : D.sheets.map(s => s.name.trim()).filter(n => !inv[n]).map(n => '<button class="chip" data-inv="start" data-sheet="' + esc(n) + '">▶ ' + esc(n) + '</button>').join('') +

    (keys.length ? '' : '<div class="sub" style="line-height:1.6;max-width:720px">Пересчитываете склад? Выберите <b>один лист</b> (например, SSD) и нажмите на него. Дальше у каждого найденного товара этого листа делайте «Пересчёт» или «✔ Всё верно». ' +
      'Здесь появится колонка <b>«Не проверены»</b>: товары, у которых в таблице остаток больше нуля, но после начала их никто не трогал. Скорее всего, их уже нет. ' +
      'В конце их можно обнулить одной кнопкой (админ): строки не удаляются, в «Журнал» пишется старое количество. <b>Остальные листы инвентаризация не затрагивает.</b> Можно вести несколько листов одновременно.</div>') +

      (L.slice(0, limit).map(i => invRow(i, true)).join('') || '<div class="empty">' + (left.length ? 'В этом разделе всё проверено 🎉' : 'Все товары проверены 🎉') + '</div>') +
      (L.length > limit ? '<div style="text-align:center;margin-top:14px"><button class="chip" data-more="1">Показать ещё (осталось ' + (L.length - limit) + ')</button></div>' : '') + '</div></div>' +
    '<div class="card c6"><h3>✔ Проверены<span>' + Dn.length + ' поз.</span></h3><div class="list">' +
      (Dn.slice(0, limit).map(i => invRow(i, false)).join('') || '<div class="empty">Пока ничего не отмечено</div>') + '</div></div>' +
  '</div>';

/* «✔ Всё верно»: отмечаем сразу, запись в «Журнал» идёт в фоне (можно быстро отмечать подряд) */
async function invOk(idx) {
  const it = D.items[idx]; if (!it || !invE(it) || it.ck || !canEdit()) return;
  it.ck = 1; invBusy++; render(); refreshDet();
  try {
    const j = await api({ action: 'inv', cmd: 'ok', token: getToken(), sheet: D.sheets[it.s].name, row: it.r, id: it.id, name: it.n });
    if (typeof j.qty === 'number') it.q = j.qty;
    toast('✔ Отмечено: ' + oneLine(it.n).slice(0, 50));
  } catch (e) {
    it.ck = 0;
    if (e.code === 'auth') { setToken(''); closeDet(); showLogin(e.message); return; }
    toast('⚠️ ' + e.message);
  } finally { invBusy--; if (D) { render(); refreshDet(); } }
}

function stockHtml() {
  const names = D.sheets.map(s => s.name.trim());
  const tokens = norm(query).split(' ').filter(Boolean);
  const searching = tokens.length > 0;
  const zeros = showZero || searching;   // при поиске ищем по ВСЕЙ базе, в том числе по тому, чего сейчас нет на складе
  // Поиск как у бота: все слова запроса должны найтись; P/N находится и без дефисов, точек, пробелов
  const hayOf = i => i._h || (i._h = norm(names[i.s] + ' ' + (i.v || []).join(' ') + ' ' + i.n));
  const squash = s => s.replace(/[\s\-\/.]/g, '');
  const hit = i => { const h = hayOf(i); const hc = i._hc || (i._hc = squash(h));
    return tokens.every(t => { const tc = squash(t); return h.indexOf(t) >= 0 || (tc.length >= 4 && hc.indexOf(tc) >= 0); }); };
  const base = D.items.filter(i => zeros || i.q > 0);
  let items = base.filter(i => (cat < 0 || i.s === cat) && (!searching || hit(i)));
  if (searching) items = items.map((i, k) => [i, k]).sort((a, b) => ((b[0].q > 0) - (a[0].q > 0)) || (a[1] - b[1])).map(x => x[0]);   // сначала то, что в наличии
  const chips = '<button class="chip' + (cat < 0 ? ' on' : '') + '" data-cat="-1">Все <small>' + base.length + '</small></button>' +
    D.sheets.map((s, k) => { const n = base.filter(i => i.s === k).length; return '<button class="chip' + (cat === k ? ' on' : '') + '" data-cat="' + k + '">' + esc(s.name.trim()) + ' <small>' + n + '</small></button>'; }).join('') +
    (searching ? '' : '<button class="chip' + (showZero ? ' on' : '') + '" data-zero="1">С нулём</button>') +
    (canEdit() ? '<button class="chip add" data-newitem="' + (cat >= 0 ? cat : '') + '">＋ Новый товар</button>' : '') +
    (isAdmin() ? '<button class="chip add" data-newcat="1">＋ Новый раздел</button>' : '');
  const shown = items.slice(0, limit), left = items.length - shown.length;
  return '<div class="chips">' + chips + '</div><div class="card"><h3>' + (searching ? 'Найдено: ' + items.length : (showZero ? 'Вся база: ' : 'На складе: ') + items.length + ' поз.') +
    (searching ? '<span>включая позиции с нулём</span>' : '') + '</h3>' +
    (items.length ? '<div class="list">' + shown.map(rowHtml).join('') + '</div>' :
      (!searching && cat >= 0 && !D.items.some(i => i.s === cat) ? '<div class="empty">В разделе «' + esc(D.sheets[cat].name.trim()) + '» пока нет товаров.<br>' + (canEdit() ? '<button class="chip add" data-newitem="' + cat + '" style="margin-top:12px">＋ Добавить первый товар</button>' : 'Добавьте первый через бота или мини-приложение.') + '</div>'
        : '<div class="empty">Ничего не найдено. Попробуйте короче: только модель или P/N.</div>')) +
    (left > 0 ? '<div style="text-align:center;margin-top:14px"><button class="chip" data-more="1">Показать ещё ' + Math.min(150, left) + ' (осталось ' + left + ')</button></div>' : '') + '</div>';
}

/* ---------- сборки: черновик → собран → продан (то же, что в мини-приложении) ----------
   Черновик — детали только зарезервированы (со склада не списаны), состав можно менять.
   Собран — детали списаны, сервер стоит на складе; состав можно менять: снятая деталь вернётся на склад, добавленная спишется.
   Продан — состав закрыт. */
const SLOT_RE = [['Платформа', /server|сервер|платформ/i], ['Процессор', /cpu|процессор/i], ['Память', /^\s*ram|памят|memory/i],
  ['SSD', /ssd|nvme/i], ['HDD', /hdd/i], ['Сеть / FC', /network|сет|nic|\bfc\b/i], ['RAID', /raid/i], ['Блок питания', /psu|блок/i],
  ['GPU', /gpu|видео/i], ['Охлаждение', /heatsink|fan|радиат|вентил|кулер/i], ['Корзина', /cage|корзин/i], ['Прочее', /[\s\S]*/]];
const slotOfS = sh => sh.slot || SLOT_RE.find(s => s[1].test(sh.name))[0];
const slotListS = () => D.slots || SLOT_RE.map(s => s[0]);
const isSoldB = b => /продан/i.test(b.st), isDraftBS = b => /черновик/i.test(b.st);
const bStat = b => isDraftBS(b) ? ['draft', 'Черновик'] : isSoldB(b) ? ['sold', 'Продан'] : ['built', 'Собран'];
const ikeyS = it => D.sheets[it.s].name.trim() + '|' + it.id;
const bItemS = p => D.items.find(x => x.s === p.s && x.id === p.id);
const fmtD = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString('ru-RU') + ' ' + d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }); };
function rsvMapS(exceptNo) {
  const m = {};
  (D.builds || []).forEach(b => { if (isDraftBS(b) && b.no !== exceptNo) (b.items || []).forEach(p => { const k = p.s + '|' + p.i; m[k] = (m[k] || 0) + p.q; }); });
  return m;
}
function rsvByS(it) {
  const k = ikeyS(it), out = [];
  (D.builds || []).forEach(b => { if (isDraftBS(b)) (b.items || []).forEach(p => { if (p.s + '|' + p.i === k) out.push({ no: b.no, q: p.q }); }); });
  return out;
}
let bFilter = 'built', sb = null, bNo = 0, bBusy = false;   // фильтр списка; рабочая сборка в окне; номер открытой карточки
function bMaxS(it) {
  const own = sb && sb.no && isDraftBS(sb) ? sb.no : 0;
  const free = it.q - (rsvMapS(own)[ikeyS(it)] || 0);
  if (sb && sb.no && !isDraftBS(sb)) { const o = sb.orig.find(p => p.s === it.s && p.id === it.id); return free + (o ? o.q : 0); }
  return free;
}

  const client = (w.client || '').trim(), comment = (w.comment || '').trim();
  if (mode === 'sold' && !client) { toast('Напишите клиента — кому продаёте сборку.'); const c = $('bcl'); if (c) c.focus(); return; }
  const rows = w.parts.map(p => ({ q: p.q, p: p, it: bItemS(p) }));
  if (mode !== 'del' && rows.some(r => !r.it || r.q > bMaxS(r.it))) { toast('Некоторых деталей не хватает — проверьте список.'); return; }
  const parts = rows.map(r => ({ sheet: D.sheets[r.it.s].name, row: r.it.r, id: r.it.id, name: r.it.n, q: r.q }));
  let title, body, req, ok = 'Подтвердить';
  if (mode === 'del') { title = 'Удалить черновик №' + w.no + '?'; body = '<div class="sub">Со склада ничего не списано — детали просто станут свободными.</div>'; req = { action: 'builddel', no: w.no }; ok = 'Удалить'; }
  else if (mode === 'edit') {
    const diff = {};
    w.orig.forEach(p => { const k = p.s + ':' + p.id; diff[k] = (diff[k] || 0) - p.q; });
    w.parts.forEach(p => { const k = p.s + ':' + p.id; diff[k] = (diff[k] || 0) + p.q; });
    const back = [], take = [];
    Object.keys(diff).forEach(k => { const [s, id] = k.split(':').map(Number), it = bItemS({ s: s, id: id }); if (it && diff[k]) (diff[k] > 0 ? take : back).push({ q: Math.abs(diff[k]), it: it }); });
    title = 'Сохранить состав сборки №' + w.no;
    body = (!back.length && !take.length ? '<div class="sub">Состав не изменился.</div>' : '') +
      (back.length ? '<h4>↩️ Вернётся на склад</h4>' + bPartRows(back, '+') : '') + (take.length ? '<h4>📤 Спишется со склада</h4>' + bPartRows(take, '−') : '');
    req = { action: 'buildedit', no: w.no, comment: comment, parts: parts };
  } else {
    title = mode === 'draft' ? (isD ? 'Сохранить черновик №' + w.no : 'Сохранить черновик') : mode === 'sold' ? 'Собрать и продать' : 'Собрать на склад';
    body = '<div class="sub">' + (mode === 'draft' ? 'Эти детали будут зарезервированы (со склада пока не спишутся):' : 'Эти детали спишутся со склада:') + '</div>' + bPartRows(rows) +
      (mode === 'sold' ? '<div class="part"><span>Клиент</span><span>' + esc(client) + '</span></div>' : '') + (comment ? '<div class="part"><span>Комментарий</span><span>' + esc(comment) + '</span></div>' : '');
    req = isD ? (mode === 'draft' ? { action: 'buildedit', no: w.no, client: client, comment: comment, parts: parts }
      : { action: 'buildfinish', no: w.no, sell: mode === 'sold', client: client, comment: comment, parts: parts })
      : { action: 'build', draft: mode === 'draft', sell: mode === 'sold', client: client, comment: comment, parts: parts };
  }
  detMode = 'bconf'; sb.req = req; sb.mode = mode;
  $('det').innerHTML = '<div class="card box"><button class="x" data-close aria-label="Закрыть">✕</button><div class="dt">' + title + '</div>' + body +
    '<div class="btns"><button class="sbtn" data-bback>Назад</button><button class="pbtn" data-bgo>' + ok + '</button></div></div>';
}
async function doBAct() {
  const b = document.querySelector('[data-bgo]'); if (!b || b.disabled || !sb || !sb.req) return;
  b.disabled = true; b.textContent = 'Записываю…'; bBusy = true;
  try {
    const j = await api(Object.assign({ token: getToken() }, sb.req));
    const mode = sb.mode;
    bBusy = false; closeDet(); sb = null; toast(j.message);
    if (mode !== 'del') bFilter = mode === 'edit' ? 'built' : mode;
    await load(true);
  } catch (e) {
    bBusy = false;
    if (e.code === 'auth') { setToken(''); closeDet(); showLogin(e.message); return; }
    b.disabled = false; b.textContent = 'Повторить'; toast('⚠️ ' + e.message);
  }
}
function openBSell() {
  const b = (D.builds || []).find(x => x.no === bNo); if (!b) return;
  detMode = 'bsell';
  $('det').innerHTML = '<div class="card box"><button class="x" data-close aria-label="Закрыть">✕</button><div class="dt">Продать сборку №' + b.no + '</div>' +
    '<div class="sub">Детали уже списаны при сборке — сейчас меняется только статус.</div>' +
    '<div class="lbl">Клиент</div><input id="bscl" class="inp" maxlength="200" autocomplete="off">' +
    '<div class="lbl">Комментарий (необязательно)</div><input id="bscm" class="inp" maxlength="500" autocomplete="off">' +
    '<div class="btns"><button class="sbtn" data-bcard>Назад</button><button class="pbtn" data-bsgo>Продано</button></div></div>';
  $('bscl').focus();
}
async function doBSell() {
  const b = document.querySelector('[data-bsgo]'); if (!b || b.disabled) return;
  const client = $('bscl').value.trim(); if (!client) { toast('Напишите клиента.'); $('bscl').focus(); return; }
  b.disabled = true; b.textContent = 'Записываю…';
  try {
    const j = await api({ action: 'buildsell', token: getToken(), no: bNo, client: client, comment: $('bscm').value.trim() });
    closeDet(); toast(j.message); bFilter = 'sold'; await load(true);
  } catch (e) {
    if (e.code === 'auth') { setToken(''); closeDet(); showLogin(e.message); return; }
    b.disabled = false; b.textContent = 'Повторить'; toast('⚠️ ' + e.message);
  }
}
document.addEventListener('click', e => {
  if (!D) return;
  const fl = e.target.closest('[data-bfl]'); if (fl) { bFilter = fl.dataset.bfl; render(); return; }
  if (e.target.closest('[data-bnew]')) { openBEdit(null); return; }
  const bc = e.target.closest('[data-bno]'); if (bc && !e.target.closest('#det')) { openBCard(Number(bc.dataset.bno)); return; }
  if (e.target.closest('[data-bed]')) { const b = (D.builds || []).find(x => x.no === bNo); if (b) openBEdit(b); return; }
  if (e.target.closest('[data-bsell]')) { openBSell(); return; }
  if (e.target.closest('[data-bcard]')) { detMode = 'bcard'; renderBCard(); return; }
  if (e.target.closest('[data-bsgo]')) { doBSell(); return; }
  if (!sb) return;
  const pk = e.target.closest('[data-bpick]');
  if (pk) {
    const [s, id] = pk.dataset.bpick.split(':').map(Number), it = D.items.find(x => x.s === s && x.id === id); if (!it) return;
    const ex = sb.parts.find(p => p.s === s && p.id === id);
    if (bMaxS(it) <= (ex ? ex.q : 0)) { toast(it.q > 0 ? 'Свободных нет: остальное зарезервировано в черновиках других сборок.' : 'Этой детали нет на складе. Сначала сделайте «Приход».'); return; }
    if (ex) ex.q++; else sb.parts.push({ s: s, id: id, q: 1 });
    renderBEdit(); const q = $('bsq'); if (q) q.focus();
    return;
  }
  const q = e.target.closest('[data-bq]'); if (q) { const p = sb.parts[Number(q.dataset.bq)]; if (p) { p.q = Math.max(1, p.q + Number(q.dataset.d)); renderBEdit(); } return; }
  const rm = e.target.closest('[data-brm]'); if (rm) { sb.parts.splice(Number(rm.dataset.brm), 1); renderBEdit(); return; }
  const act = e.target.closest('[data-bact]'); if (act && !act.disabled) { askBAct(act.dataset.bact); return; }
  if (e.target.closest('[data-bback]')) { detMode = 'bedit'; renderBEdit(); return; }
  if (e.target.closest('[data-bgo]')) { doBAct(); return; }
});
document.addEventListener('input', e => {
  if (!sb) return;
  if (e.target.id === 'bcl') sb.client = e.target.value;
  if (e.target.id === 'bcm') sb.comment = e.target.value;
});
function salesHtml() {
  const mx = Math.max.apply(null, X.cats.map(c => c.units)) || 1;
  return '<div class="grid"><div class="card c6"><h3>Остатки по категориям<span>шт.</span></h3>' +
    X.cats.map(c => '<div class="part"><span style="color:var(--ink)">' + esc(c.name) + '</span><span style="flex:1;margin:0 12px;align-self:center"><div class="seg" style="margin:0"><i style="background:rgba(12,35,71,.06)"><b data-w="' + Math.round(c.units / mx * 100) + '"></b></i></div></span><span>' + c.units + '</span></div>').join('') + '</div>' +
    '<div class="card c6"><h3>Топ продаж за 30 дней<span>шт.</span></h3><div class="list">' +
    (X.top.slice(0, 10).map(i => '<div class="it"><div class="t"><div class="n">' + esc(oneLine(i.n)) + '</div><div class="m">' + esc(X.sheetName(i)) + '</div></div><span class="q">' + i.s30 + '</span></div>').join('') || '<div class="empty">Пока нет данных</div>') + '</div></div></div>';
}

/* ---------- рисование и анимации ---------- */
const TITLES = { home: ['Обзор', 'Сводка по складу'], stock: ['Склад', 'Всё, что есть в наличии'], low: ['Заканчивается', 'Что пора докупить'], inv: ['Инвентаризация', 'Что ещё не проверили'], builds: ['Сборки', 'Собранные серверы'], sales: ['Продажи', 'Что и сколько уходит'] };
function render() {
  if (!D) return;
  X = buildX(); renderNav();
  $('title').firstChild.nodeValue = TITLES[page][0]; $('sub').textContent = TITLES[page][1];
  const v = $('view');
  const same = lastPage === page; lastPage = page;   // тот же раздел (поиск, кнопки) — без повторной анимации
  v.classList.toggle('noanim', same);
  if (!same) { v.classList.remove('page'); void v.offsetWidth; v.classList.add('page'); }
  v.innerHTML = ({ home: homeHtml, stock: stockHtml, low: lowHtml, inv: invHtml, builds: buildsHtml, sales: salesHtml })[page]();
  requestAnimationFrame(() => requestAnimationFrame(animate));
}
function animate() {
  const still = $('view').classList.contains('noanim');   // обновление данных или поиск — без «набегания» цифр
  document.querySelectorAll('[data-count]').forEach(el => {
    const end = Number(el.dataset.count), t0 = performance.now(), dur = still ? 0 : 1100;
    if (still) { el.textContent = end; return; }
    const step = now => { const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(end * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
  document.querySelectorAll('[data-h]').forEach(el => { el.style.height = el.dataset.h + '%'; });
  document.querySelectorAll('[data-w]').forEach(el => { el.style.width = el.dataset.w + '%'; });
}

/* ---------- вход по коду из бота и загрузка данных ---------- */
const API_URL = 'https://script.google.com/macros/s/AKfycbxzbPhxv0NFAqCPdbXx7AoWC_ecIhmXfdbz7mqJakzQp1oWA_oN9lEO3XKOrD_5EZ0/exec';
const BOT = '@Aiproserverstock_bot';
const TOKEN_KEY = 'sklad_web_token';
let memToken = '';   // запасной вариант, если браузер не даёт хранить данные (приватное окно)
const getToken = () => { if (memToken) return memToken; try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } };
const setToken = t => { memToken = t || ''; try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {} };
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 4000); }

async function api(body, timeoutMs) {
  let res;
  const ctl = timeoutMs && window.AbortController ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), timeoutMs) : 0;
  try { res = await fetch(API_URL + '?api=1', { method: 'POST', body: JSON.stringify(body), signal: ctl ? ctl.signal : undefined }); }
  catch (e) { clearTimeout(timer); throw new Error('Нет связи с таблицей. Проверьте интернет.'); }
  clearTimeout(timer);
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Таблица ответила с ошибкой. Попробуйте ещё раз.'); }
  if (!j.ok) { const err = new Error(j.error || 'Ошибка'); err.code = j.code; throw err; }
  return j;
}

function showLogin(msg) {
  D = null; lastPage = '';
  document.body.classList.add('login');
  ['refresh', 'logout'].forEach(id => $(id).classList.add('hidden'));
  $('foot').textContent = '';
  const v = $('view'); v.classList.remove('noanim');
  v.innerHTML = '<div class="card lg"><div class="logo2">//</div><h2>Вход на сайт склада</h2><p>Пускаем только сотрудников из листа «Сотрудники».</p>' +
    '<ol><li>Откройте в Telegram бота <b>' + BOT + '</b></li><li>Напишите ему команду <b>/web</b></li><li>Введите 6-значный код, который пришлёт бот</li></ol>' +
    '<input id="code" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code">' +
    '<button class="btn" id="go">Войти</button><div class="err" id="err">' + esc(msg || '') + '</div></div>';
  const code = $('code');
  code.addEventListener('input', () => { code.value = code.value.replace(/\D/g, '').slice(0, 6); if (code.value.length === 6) doLogin(); });
  code.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('go').addEventListener('click', doLogin);
  code.focus();
}
let loginBusy = false;
async function doLogin() {
  const code = ($('code') || {}).value || '';
  if (loginBusy) return;
  if (code.length !== 6) { $('err').textContent = 'Введите 6 цифр из бота.'; return; }
  loginBusy = true; $('go').disabled = true; $('go').textContent = 'Проверяю…'; $('err').textContent = '';
  try {
    const j = await api({ action: 'weblogin', code: code });
    setToken(j.token);
    await load();
  } catch (e) {
    $('err').textContent = e.message; $('go').disabled = false; $('go').textContent = 'Войти'; $('code').value = ''; $('code').focus();
  } finally { loginBusy = false; }
}

// Экран «не удалось загрузить»: вход при этом сохранён, повторный код не нужен
function showRetry(msg) {
  D = null; lastPage = '';
  document.body.classList.add('login');
  ['refresh', 'logout'].forEach(id => $(id).classList.add('hidden'));
  $('foot').textContent = '';
  const v = $('view'); v.classList.remove('noanim');
  v.innerHTML = '<div class="card lg"><div class="logo2">//</div><h2>Не удалось загрузить склад</h2><p>' + esc(msg || '') + '</p>' +
    '<p>Вход сохранён — вводить код заново не нужно.</p><button class="btn" id="retry">Повторить</button>' +
    '<button class="topbtn" id="relog" style="margin-top:10px;width:100%">Войти по коду заново</button></div>';
  $('retry').addEventListener('click', () => load(false));
  $('relog').addEventListener('click', () => { setToken(''); showLogin(''); });
}

async function load(silent, n) {
  n = n || 0;
  try {
    const j = await api({ action: 'init', web: true, token: getToken() });
    delete j.ok;
    D = j;
    document.body.classList.remove('login');
    ['refresh', 'logout'].forEach(id => $(id).classList.remove('hidden'));
    $('whoName').textContent = D.me.name + ' · ' + D.me.role; $('ava').textContent = (D.me.name || '?').trim().charAt(0).toUpperCase();
    const t = new Date(); $('foot').textContent = 'Данные из таблицы · обновлено ' + t.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) + ' · изменения из бота и мини-приложения появляются здесь сами через несколько секунд';
    if (lastPage === '') { const p = location.hash.slice(1); if (PAGES.some(x => x[0] === p)) page = p; }
    render(); refreshDet();
    if (!silent) toast('✅ Данные загружены');
  } catch (e) {
    if (e.code === 'auth') { setToken(''); showLogin(e.message); }
    else if (!D) {
      // сбой связи или «холодный старт» Google: вход не сбрасываем — пробуем ещё пару раз, потом даём кнопку «Повторить»
      if (getToken() && n < 3) setTimeout(() => load(silent, n + 1), 2500);
      else if (getToken()) showRetry(e.message);
      else showLogin(e.message);
    }
    else toast('⚠️ ' + e.message);
  }
}
$('refresh').addEventListener('click', () => load(false));
$('logout').addEventListener('click', () => {
  const t = getToken(); setToken('');
  if (t) api({ action: 'weblogout', token: t }).catch(() => {});   // и на сервере сессию закрываем
  showLogin('Вы вышли с сайта.');
});
setInterval(() => { if (!document.hidden && getToken() && D && !window.DEMO_DATA && !opBusy && !invBusy) load(true); }, 60000);   // полное обновление (журнал, продажи, ручные правки в таблице)
/* Вернулись на вкладку сайта (компьютер спал, была открыта другая вкладка) — сразу перечитываем склад: пока вкладка была скрыта, опрос стоял,
   а в мини-приложении или боте могли начать/завершить инвентаризацию или что-то отметить. */
let pollKick = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !getToken() || !D || window.DEMO_DATA) return;
  pollKick = true;
  if (!opBusy && !invBusy) load(true);
});

/* ---------- синхронизация («длинный опрос»): запрос «что изменилось?» висит на сервере до 20 секунд и отвечает сразу, как только
   кто-то (бот, мини-приложение, другой компьютер) изменил остаток; потом тут же спрашиваем снова ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function applyChanges(list) {
  list.forEach(c => { const it = D.items.find(i => D.sheets[i.s].name.trim() === c.s && i.id === c.i); if (it) { it.q = c.q; if (invE(it)) it.ck = 1; } });   // во время инвентаризации любое изменение = проверен
}
(async function pollLoop() {
  let fails = 0;
  for (;;) {
    if (document.hidden || !getToken() || !D || window.DEMO_DATA || opBusy || invBusy) { await sleep(1000); continue; }
    try {
      const j = await api({ action: 'changes', token: getToken(), since: D.rev == null ? null : D.rev, wait: 20 }, 40000);
      fails = 0;
      if (opBusy || invBusy) continue;                              // пока своя операция записывается — чужие данные не подмешиваем
      if (j.full) await load(true);                       // изменилось что-то крупное (новый товар, данные, сборка, раздел) — перечитываем всё
      else if (j.rev !== D.rev) { applyChanges(j.ch); D.rev = j.rev; render(); refreshDet(); }
    } catch (e) {
      if (e.code === 'auth') { setToken(''); closeDet(); showLogin(e.message); }
      fails++; pollKick = false;
      const until = Date.now() + Math.min(15000, 1500 * fails);
      while (Date.now() < until && !pollKick) await sleep(300);   // вернулись на вкладку — не ждём, пробуем сразу
    }
  }
})();

/* ---------- старт ---------- */
(function start() {
  if (window.DEMO_DATA) {
    D = JSON.parse(JSON.stringify(window.DEMO_DATA));
    $('whoName').textContent = 'Окил · админ'; $('ava').textContent = 'О';
    $('foot').textContent = 'Демо-режим: данные показаны для примера, в таблицу ничего не записывается.';
    const p = location.hash.slice(1); if (PAGES.some(x => x[0] === p)) page = p;
    render(); return;
  }
  if (getToken()) load(true); else showLogin('');
})();
